<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>TikTok Profile</title>

<style>

body{
margin:0;
font-family:Arial;
background:#000;
color:white;
}

.container{
max-width:500px;
margin:auto;
}

.header{
text-align:center;
padding:20px;
border-bottom:1px solid #222;
}

.avatar{
width:90px;
height:90px;
border-radius:50%;
border:3px solid #ff0050;
object-fit:cover;
}

.username{
font-size:20px;
font-weight:bold;
margin-top:10px;
}

.userid{
color:#aaa;
font-size:14px;
}

.stats{
display:flex;
justify-content:space-around;
margin-top:15px;
}

.stats div{
text-align:center;
}

.number{
font-weight:bold;
font-size:18px;
}

.label{
font-size:13px;
color:#aaa;
}

.follow-btn{
margin-top:15px;
background:#ff0050;
padding:10px 25px;
border-radius:6px;
display:inline-block;
cursor:pointer;
}

.bio{
margin-top:10px;
font-size:14px;
color:#ccc;
}

.videos{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:2px;
margin-top:10px;
}

.video{
position:relative;
}

.video img{
width:100%;
height:160px;
object-fit:cover;
}

.views{
position:absolute;
bottom:5px;
left:5px;
font-size:12px;
background:rgba(0,0,0,0.6);
padding:2px 6px;
border-radius:4px;
}

.bottom-nav{
position:fixed;
bottom:0;
width:100%;
background:#000;
border-top:1px solid #222;
display:flex;
justify-content:space-around;
padding:10px 0;
}

.bottom-nav div{
color:white;
font-size:14px;
}

</style>
</head>

<body>

<div class="container">

<div class="header">

<img class="avatar" src="https://i.pravatar.cc/150">

<div class="username">Ngọc Danh</div>
<div class="userid">@ngocdanh</div>

<div class="stats">

<div>
<div class="number">120</div>
<div class="label">Following</div>
</div>

<div>
<div class="number">45K</div>
<div class="label">Followers</div>
</div>

<div>
<div class="number">300K</div>
<div class="label">Likes</div>
</div>

</div>

<div class="follow-btn">Follow</div>

<div class="bio">
🔥 Content Creator <br>
🎮 Gaming & Fun
</div>

</div>


<div class="videos">

<div class="video">
<img src="https://picsum.photos/300/500?1">
<div class="views">▶ 12K</div>
</div>

<div class="video">
<img src="https://picsum.photos/300/500?2">
<div class="views">▶ 8K</div>
</div>

<div class="video">
<img src="https://picsum.photos/300/500?3">
<div class="views">▶ 22K</div>
</div>

<div class="video">
<img src="https://picsum.photos/300/500?4">
<div class="views">▶ 5K</div>
</div>

<div class="video">
<img src="https://picsum.photos/300/500?5">
<div class="views">▶ 19K</div>
</div>

<div class="video">
<img src="https://picsum.photos/300/500?6">
<div class="views">▶ 7K</div>
</div>

</div>

</div>


<div class="bottom-nav">

<div>🏠</div>
<div>👥</div>
<div>➕</div>
<div>📩</div>
<div>👤</div>

</div>

</body>
</html>
